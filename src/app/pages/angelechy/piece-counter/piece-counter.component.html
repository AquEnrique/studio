<div class="flex flex-1 basis-0 flex-col items-center gap-2 bg-card p-3 sm:gap-3 sm:p-4">
  <div class="flex w-full items-center justify-between">
    <span class="text-sm font-semibold text-muted-foreground sm:text-base">{{ label }}</span>
    <button
      appButton
      variant="ghost"
      size="icon"
      class="h-8 w-8"
      (click)="reset.emit()"
      [attr.aria-label]="'Reiniciar ' + label + ' a 0'"
    >
      <lucide-icon name="RotateCcw" [size]="16" />
    </button>
  </div>

  <button
    type="button"
    (pointerdown)="startHold(1)"
    (pointerup)="stopHold()"
    (pointerleave)="stopHold()"
    (pointercancel)="stopHold()"
    class="flex h-14 w-full items-center justify-center rounded-lg bg-success/15 text-success transition-colors active:bg-success/25 sm:h-16 [@media(orientation:landscape)]:h-12"
    [attr.aria-label]="'Sumar 1 a ' + label"
  >
    <lucide-icon name="Plus" [size]="28" />
  </button>

  <div class="relative flex flex-1 items-center justify-center gap-2 py-2">
    @if (flash(); as f) {
      <span
        class="pointer-events-none absolute -top-1 animate-in fade-in slide-in-from-bottom-2 text-base font-bold duration-300 sm:text-xl"
        [class.text-success]="f.text.startsWith('+')"
        [class.text-destructive]="!f.text.startsWith('+')"
      >
        {{ f.text }}
      </span>
    }
    <span class="select-none text-5xl leading-none sm:text-6xl [@media(orientation:landscape)]:text-4xl" aria-hidden="true">{{ symbol }}</span>
    <span class="font-score select-none text-5xl font-black leading-none sm:text-6xl [@media(orientation:landscape)]:text-4xl">{{ value }}</span>
  </div>

  <button
    type="button"
    (pointerdown)="startHold(-1)"
    (pointerup)="stopHold()"
    (pointerleave)="stopHold()"
    (pointercancel)="stopHold()"
    class="flex h-14 w-full items-center justify-center rounded-lg bg-destructive/15 text-destructive transition-colors active:bg-destructive/25 sm:h-16 [@media(orientation:landscape)]:h-12"
    [attr.aria-label]="'Restar 1 a ' + label"
  >
    <lucide-icon name="Minus" [size]="28" />
  </button>
</div>
