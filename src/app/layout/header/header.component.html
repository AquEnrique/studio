<header class="sticky top-0 z-30 w-full border-b bg-background/95 pt-[env(safe-area-inset-top)] backdrop-blur supports-[backdrop-filter]:bg-background/60">
  <div class="flex min-h-14 flex-wrap items-center gap-3 py-2 pl-10 pr-4">
    <div class="flex min-w-0 shrink-0 items-center gap-2">
      @if (isJudgeRoute()) {
        <a appButton routerLink="/" variant="ghost" size="icon" class="shrink-0">
          <lucide-icon name="ArrowLeft" [size]="20" />
          <span class="sr-only">Volver a la vista normal</span>
        </a>
        <span class="truncate text-sm font-semibold sm:text-base">Vista de Juez</span>
      } @else {
        <a routerLink="/" class="flex min-w-0 items-center gap-2">
          <span class="truncate text-sm font-semibold sm:text-base">YGO Tournament Manager</span>
        </a>
      }
    </div>

    <div class="order-last flex min-w-0 basis-full items-center justify-center gap-2 sm:order-none sm:basis-0 sm:flex-1">
      <app-clock-display />
      @if (isRunning()) {
        <div appBadge variant="secondary" class="whitespace-nowrap">
          Ronda {{ tournament.tournament()!.rounds.length }} de {{ tournament.recommendedRounds() }}
        </div>
      }
    </div>

    <div class="flex shrink-0 items-center gap-2">
      @if (!isJudgeRoute() && isRunning()) {
        <a appButton routerLink="/judge" variant="outline" [size]="breakpoint.isMobile() ? 'icon' : 'default'">
          <lucide-icon name="Gavel" [size]="18" />
          @if (!breakpoint.isMobile()) {
            <span>Juez</span>
          }
        </a>
      }
    </div>
  </div>
</header>
